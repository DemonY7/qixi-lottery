<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>七夕幸运抽奖</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      overflow:hidden;
      background:#0d0620;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    }
    #stage {
      position:relative; width:100%; height:100%;
      background:radial-gradient(ellipse at 50% 30%,#25144a 0%,#0d0620 70%);
      overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 10% 20%,rgba(255,255,255,.9) 50%,transparent 55%),radial-gradient(1.5px 1.5px at 80% 15%,rgba(255,255,255,.8) 50%,transparent 55%),radial-gradient(1.8px 1.8px at 40% 10%,rgba(255,255,255,.7) 50%,transparent 55%),radial-gradient(1.2px 1.2px at 70% 40%,rgba(255,255,255,.7) 50%,transparent 55%),radial-gradient(1.5px 1.5px at 25% 55%,rgba(255,255,255,.6) 50%,transparent 55%),radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,.6) 50%,transparent 55%),radial-gradient(1.6px 1.6px at 55% 75%,rgba(255,255,255,.7) 50%,transparent 55%),radial-gradient(1.3px 1.3px at 15% 85%,rgba(255,255,255,.6) 50%,transparent 55%),radial-gradient(1.4px 1.4px at 85% 90%,rgba(255,255,255,.7) 50%,transparent 55%);animation:twinkle 3s ease-in-out infinite alternate}
    @keyframes twinkle{to{opacity:.7}}
    .moon{position:absolute;top:8%;right:12%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9e6,#f5e6b3 60%,#d4b87a);box-shadow:0 0 40px 12px rgba(255,240,180,.35)}

    .title{position:relative;z-index:10;color:#fff;font-size:clamp(26px,7vw,44px);letter-spacing:.12em;text-align:center;text-shadow:0 4px 20px rgba(255,160,220,.6);margin-bottom:6px}
    .subtitle{position:relative;z-index:10;color:#ffd6f0;font-size:clamp(13px,3.5vw,17px);margin-bottom:20px;text-align:center}

    /* 奖项轨道 */
    .track-wrap{position:relative;z-index:10;width:min(90vw,380px);margin-bottom:16px}
    .track{display:flex;gap:6px;justify-content:center;align-items:flex-end}
    .prize-slot{
      flex:0 0 calc(100%/7);
      max-width:54px;
      height:60px;
      border-radius:10px;
      background:rgba(255,255,255,.08);
      border:2px solid transparent;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;color:#ffd6f0;
      transition:all .15s ease;
      overflow:hidden;
    }
    .prize-slot.active{
      background:rgba(255,94,156,.3);
      border-color:#ff5e9c;
      box-shadow:0 0 16px rgba(255,94,156,.5);
      transform:scale(1.12);
    }
    .prize-slot.winner{
      background:rgba(255,215,0,.25);
      border-color:#ffd700;
      box-shadow:0 0 24px rgba(255,215,0,.6);
      transform:scale(1.2);
    }
    .prize-slot .slot-img{width:100%;height:100%;object-fit:contain;opacity:.35}
    .prize-slot.active .slot-img{opacity:1}

    /* 跑动人物 */
    .runner-container{
      position:relative;z-index:15;
      width:min(90vw,380px);
      height:80px;
      margin-bottom:16px;
    }
    .runner{
      position:absolute;
      bottom:0;
      width:60px;height:60px;
      transition:left .12s linear;
      pointer-events:none;
    }
    .runner img{width:100%;height:100%;object-fit:contain;animation:runBob .2s ease-in-out infinite alternate}
    @keyframes runBob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
    .runner.idle img{animation:none}

    /* 抽奖按钮 */
    .draw-btn{
      position:relative;z-index:10;
      padding:14px 48px;
      border:none;border-radius:40px;
      background:linear-gradient(135deg,#ff5e9c,#ff9ec8);
      color:#fff;font-size:18px;font-weight:700;
      box-shadow:0 12px 36px rgba(255,70,140,.4);
      cursor:pointer;
      animation:pulseBtn 2s ease-in-out infinite;
      transition:transform .15s ease;
    }
    .draw-btn:active{transform:scale(.95)}
    .draw-btn.disabled{background:linear-gradient(135deg,#7a5c9c,#a78fc9);cursor:not-allowed;animation:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    @keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    .count-bar{position:relative;z-index:10;margin-top:16px;color:#fff;font-size:15px;background:rgba(255,255,255,.12);padding:8px 20px;border-radius:30px;backdrop-filter:blur(6px)}
    .count-bar span{color:#ffd6f0;font-weight:700}

    .history{position:relative;z-index:10;margin-top:14px;width:min(90vw,380px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .history-chip{background:rgba(255,255,255,.15);color:#fff;font-size:13px;padding:6px 12px;border-radius:18px;backdrop-filter:blur(4px);animation:popIn .35s cubic-bezier(.2,.8,.2,1)}
    @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

    /* 结果弹窗 */
    .result-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
    .result-modal.show{opacity:1;pointer-events:auto}
    .result-card{width:min(82vw,340px);background:linear-gradient(180deg,#fff0f8 0%,#fff 100%);border-radius:24px;padding:24px 20px 20px;text-align:center;color:#5e2d4f;box-shadow:0 28px 70px rgba(0,0,0,.45);transform:translateY(40px) scale(.85);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
    .result-modal.show .result-card{transform:translateY(0) scale(1)}
    .result-char{width:180px;height:180px;margin:0 auto 10px;animation:jumpOut .6s cubic-bezier(.2,1.5,.4,1)}
    .result-char img{width:100%;height:100%;object-fit:contain}
    @keyframes jumpOut{0%{transform:translateY(100%) scale(.3);opacity:0}60%{transform:translateY(-15px) scale(1.1);opacity:1}100%{transform:translateY(0) scale(1)}}
    .result-card h2{font-size:26px;margin-bottom:6px;color:#d63384}
    .result-card p{font-size:15px;color:#8a5a7a;margin-bottom:18px}
    .result-card button{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff5e9c,#ff9ec8);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(255,70,140,.35)}

    .particle{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;pointer-events:none}
    @keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
  </style>
</head>
<body>
  <div id="stage">
    <div class="stars"></div>
    <div class="moon"></div>

    <h1 class="title">七夕幸运抽奖</h1>
    <p class="subtitle">每人 5 次机会，试试手气吧</p>

    <div class="track-wrap">
      <div class="track" id="track"></div>
    </div>

    <div class="runner-container">
      <div class="runner idle" id="runner">
        <img src="assets/runner.png" alt="跑动">
      </div>
    </div>

    <button class="draw-btn" id="drawBtn">点击抽奖</button>
    <div class="count-bar">剩余次数：<span id="count">5</span> / 5</div>
    <div class="history" id="history"></div>
  </div>

  <div class="result-modal" id="resultModal">
    <div class="result-card">
      <div class="result-char" id="resultChar">
        <img id="resultImg" src="" alt="">
      </div>
      <h2 id="resultTitle">恭喜中奖</h2>
      <p id="resultText">你获得了一份神秘好礼</p>
      <button id="resultBtn">收下祝福</button>
    </div>
  </div>

  <script>
    const prizes = [
      { name:"谢谢参与", weight:15, icon:"💨", msg:"差一点就中奖啦", img:"assets/thanks.png" },
      { name:"50", weight:25, icon:"🧧", msg:"获得 50 元红包", img:"assets/p50.png" },
      { name:"100", weight:20, icon:"🧧", msg:"获得 100 元红包", img:"assets/p100.png" },
      { name:"200", weight:10, icon:"🧧", msg:"获得 200 元红包", img:"assets/p200.png" },
      { name:"彩票2张", weight:15, icon:"🎫", msg:"获得彩票 2 张", img:"assets/lottery2.png" },
      { name:"彩票3张", weight:10, icon:"🎫", msg:"获得彩票 3 张", img:"assets/lottery3.png" },
      { name:"彩票4张", weight:5, icon:"🎫", msg:"获得彩票 4 张", img:"assets/lottery4.png" }
    ];

    let count = 5;
    let spinning = false;
    const track = document.getElementById('track');
    const runner = document.getElementById('runner');
    const drawBtn = document.getElementById('drawBtn');
    const countEl = document.getElementById('count');
    const historyEl = document.getElementById('history');
    const modal = document.getElementById('resultModal');
    const resultImg = document.getElementById('resultImg');
    const resultTitle = document.getElementById('resultTitle');
    const resultText = document.getElementById('resultText');
    const resultBtn = document.getElementById('resultBtn');

    // 初始化奖项轨道
    prizes.forEach((p, i) => {
      const slot = document.createElement('div');
      slot.className = 'prize-slot';
      slot.id = 'slot-' + i;
      const img = document.createElement('img');
      img.className = 'slot-img';
      img.src = p.img;
      img.alt = p.name;
      slot.appendChild(img);
      track.appendChild(slot);
    });

    // 初始化跑动人物位置
    function setRunnerPos(index) {
      const container = runner.parentElement;
      const containerW = container.offsetWidth;
      const slotWidth = containerW / prizes.length;
      const targetX = slotWidth * index + slotWidth / 2 - 30;
      runner.style.left = targetX + 'px';
    }
    setTimeout(() => setRunnerPos(0), 100);

    function drawPrize() {
      const total = prizes.reduce((s, p) => s + p.weight, 0);
      let r = Math.random() * total;
      for (let i = 0; i < prizes.length; i++) {
        r -= prizes[i].weight;
        if (r <= 0) return i;
      }
      return 0;
    }

    function spawnParticles(x, y) {
      const stage = document.getElementById('stage');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / 20;
        const dist = 80 + Math.random() * 80;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        p.style.background = ['#ffd6f0','#ff9ec8','#fff','#a0d2ff','#ffd700'][Math.floor(Math.random()*5)];
        p.style.animation = `burst ${0.9 + Math.random()*0.4}s ease-out forwards`;
        stage.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }
    }

    let spinInterval = null;
    let currentSlot = 0;

    function startSpin() {
      spinning = true;
      runner.classList.remove('idle');
      drawBtn.classList.add('disabled');
      drawBtn.textContent = '抽奖中...';

      // 清除上一次的 winner 样式
      document.querySelectorAll('.prize-slot').forEach(s => s.classList.remove('winner','active'));

      const winIndex = drawPrize();
      let step = 0;
      const totalSteps = 28 + winIndex + prizes.length * 2; // 跑约2圈多
      let speed = 80;

      function tick() {
        // 清除上一个 active
        document.getElementById('slot-' + currentSlot).classList.remove('active');
        currentSlot = (currentSlot + 1) % prizes.length;
        // 设置新 active
        document.getElementById('slot-' + currentSlot).classList.add('active');
        setRunnerPos(currentSlot);

        step++;
        // 减速
        if (step > totalSteps * 0.6) {
          speed = Math.min(speed + 12, 300);
        }

        if (step >= totalSteps) {
          clearInterval(spinInterval);
          finishSpin(winIndex);
        } else {
          spinInterval = setTimeout(tick, speed);
        }
      }
      tick();
    }

    function finishSpin(winIndex) {
      spinning = false;
      // 清除所有 active
      document.querySelectorAll('.prize-slot').forEach(s => s.classList.remove('active'));
      // 标记中奖
      document.getElementById('slot-' + winIndex).classList.add('winner');
      // 跑动人物停下
      runner.classList.add('idle');
      setRunnerPos(winIndex);

      const prize = prizes[winIndex];
      count--;
      countEl.textContent = count;

      // 添加历史记录
      const chip = document.createElement('div');
      chip.className = 'history-chip';
      chip.textContent = prize.icon + ' ' + prize.name;
      historyEl.prepend(chip);

      // 粒子效果
      const rect = document.getElementById('slot-' + winIndex).getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      // 显示结果弹窗（延迟让用户看到 winner 高亮）
      setTimeout(() => {
        resultImg.src = prize.img;
        resultImg.alt = prize.name;
        resultTitle.textContent = prize.name === '谢谢参与' ? '谢谢参与' : '恭喜中奖';
        resultText.textContent = prize.msg;
        modal.classList.add('show');

        // 重置按钮
        if (count > 0) {
          drawBtn.classList.remove('disabled');
          drawBtn.textContent = '点击抽奖';
        } else {
          drawBtn.classList.add('disabled');
          drawBtn.textContent = '已用完';
        }
      }, 600);
    }

    drawBtn.addEventListener('click', () => {
      if (spinning || count <= 0) return;
      startSpin();
    });

    resultBtn.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

    window.addEventListener('resize', () => { if(!spinning) setRunnerPos(currentSlot); });
  </script>
</body>
</html>
